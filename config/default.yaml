# ============================================================
# RAVDESS Vocal Emotion Recognition — Default Configuration
# ============================================================

data:
  data_dir: "../Audio_Song_Actors_01-24"   # path to dataset folder
  sample_rate: 22050
  duration: 4.0           # seconds per clip (pad/truncate)
  n_mfcc: 40              # MFCC coefficients
  n_mels: 128             # mel bands for spectrogram
  n_fft: 2048
  hop_length: 512
  # Speaker-independent test split: last 4 actors (10 male + 10 female train)
  test_actors: [21, 22, 23, 24]
  n_classes: 6            # neutral, calm, happy, sad, angry, fearful

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 60
  early_stopping_patience: 12
  weight_decay: 0.0001
  device: "cuda"          # "cuda" or "cpu"
  seed: 42

model:
  type: "cnn"             # "cnn" | "lstm" | "gru" | "rnn" | "mlp"

  cnn:
    dropout: 0.3

  rnn:
    hidden_size: 128
    num_layers: 2
    dropout: 0.3
    bidirectional: true

  mlp:
    hidden_sizes: [256, 128]
    dropout: 0.3

output:
  model_dir: "saved_models"
  results_dir: "results"
